name: Browser check

# Проверка живого сайта в Chromium, WebKit (движок Safari) и Firefox.
# Сам сайт не собирает и не деплоит, только открывает и измеряет
on:
  push:
    branches: [claude/design-motion-colors-vmdl94]
    paths:
      - .github/browser-check/**
      - .github/workflows/browser-check.yml
  workflow_dispatch:

# write — чтобы закоммитить скриншоты обратно в ветку
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .github/browser-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm init -y > /dev/null && npm install --no-audit --no-fund playwright@latest

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: node check.mjs
        env:
          BASE_URL: https://radionova.pro

      - run: node frame-variants.mjs
        env:
          BASE_URL: https://radionova.pro

      # Скриншоты — в ту же ветку; [skip ci], чтобы коммит не запускал проверки заново
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shots
          git commit -m "chore: browser-check screenshots [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
